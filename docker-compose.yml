services:
  db:
    image: postgres:16-alpine
    container_name: safeen-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: safeen
      POSTGRES_PASSWORD: safeen_dev_2026
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
